<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FecapStudy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark fecap-navbar">
    <div class="container">
      <span class="navbar-brand fw-bold mb-0">📚 FecapStudy</span>
      <span id="statusBackend" class="badge">Verificando backend...</span>
    </div>
  </nav>

  <main class="container my-4">
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3"><div class="card kpi"><div class="card-body"><div class="kpi-valor" id="kpiSessoes">0</div><div class="kpi-rotulo">Sessões hoje</div></div></div></div>
      <div class="col-6 col-md-3"><div class="card kpi"><div class="card-body"><div class="kpi-valor" id="kpiXp">0</div><div class="kpi-rotulo">XP acumulado</div></div></div></div>
      <div class="col-6 col-md-3"><div class="card kpi"><div class="card-body"><div class="kpi-valor" id="kpiMinutos">0</div><div class="kpi-rotulo">Minutos estudados</div></div></div></div>
      <div class="col-6 col-md-3"><div class="card kpi"><div class="card-body"><div class="kpi-valor" id="kpiMeta">0%</div><div class="kpi-rotulo">Meta semanal</div></div></div></div>
    </div>

    <div class="row g-4">
      <div class="col-lg-6">
        <div class="card"><div class="card-body">
          <h5 class="card-title">Registrar sessão de estudo</h5>
          <form id="formSessao" novalidate>
            <div class="mb-3"><label class="form-label" for="inputNome">Nome do discente</label>
              <input class="form-control" id="inputNome" value="Lucas Silva" required></div>
            <div class="row g-3 mb-3">
              <div class="col-md-6"><label class="form-label" for="selectDisciplina">Disciplina</label><select class="form-select" id="selectDisciplina"></select></div>
              <div class="col-md-6"><label class="form-label" for="selectModalidade">Modalidade</label>
                <select class="form-select" id="selectModalidade">
                  <option value="Pomodoro">Pomodoro</option><option value="Exercicios">Exercícios</option><option value="Leitura">Leitura</option>
                </select></div>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-6"><label class="form-label" for="inputDuracao">Duração (min)</label>
                <input type="number" class="form-control" id="inputDuracao" min="1" max="480" value="25"></div>
              <div class="col-md-6"><label class="form-label">Prévia de XP</label><div class="previa-xp" id="previaXp">—</div></div>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-6"><label class="form-label" id="labelExtra1" for="inputExtra1"></label><input type="number" min="0" class="form-control" id="inputExtra1"></div>
              <div class="col-md-6" id="grupoExtra2"><label class="form-label" id="labelExtra2" for="inputExtra2"></label><input type="number" min="0" class="form-control" id="inputExtra2"></div>
              <div class="col-md-6 d-flex align-items-end" id="grupoResumo"><div class="form-check"><input class="form-check-input" type="checkbox" id="checkResumo"><label class="form-check-label" for="checkResumo">Fiz resumo (+25 XP)</label></div></div>
            </div>
            <div class="d-flex gap-2 flex-wrap">
              <button type="submit" class="btn btn-fecap" id="btnRegistrar">Registrar sessão</button>
              <button type="button" class="btn btn-outline-secondary" id="btnNotificar">Notificar responsável</button>
            </div>
          </form>
        </div></div>

        <div class="card mt-4"><div class="card-body">
          <h5 class="card-title">Relatório do discente</h5>
          <div class="input-group mb-3">
            <input class="form-control" id="inputRelatorioNome" placeholder="Nome do discente" value="Lucas Silva">
            <button class="btn btn-fecap" id="btnRelatorio">Buscar</button>
          </div>
          <pre class="relatorio" id="relatorioResultado">Busque um discente para ver o relatório.</pre>
        </div></div>
      </div>

      <div class="col-lg-6">
        <div class="card"><div class="card-body">
          <h5 class="card-title">Progresso da meta semanal</h5>
          <div class="progress" style="height:22px"><div class="progress-bar bg-danger" id="barraProgresso" style="width:0%"></div></div>
          <small class="text-muted" id="textoProgresso"></small>
        </div></div>

        <div class="card mt-4"><div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="card-title mb-0">Histórico</h5>
            <button class="btn btn-sm btn-outline-secondary" id="btnAtualizar">Atualizar do servidor</button>
          </div>
          <input class="form-control mb-3" id="inputFiltro" placeholder="Filtrar por nome, disciplina ou modalidade">
          <ul class="list-group historico" id="listaHistorico"></ul>
        </div></div>
      </div>
    </div>
  </main>

  <footer class="text-center text-muted py-4 small">FecapStudy · API em http://localhost:5080</footer>
  <div id="toast"></div>

  <script src="js/interfaces/INotificador.js"></script>
  <script src="js/interfaces/IExportavelJson.js"></script>
  <script src="js/models/Disciplina.js"></script>
  <script src="js/models/SessaoEstudo.js"></script>
  <script src="js/models/Usuario.js"></script>
  <script src="js/models/MetaEstudo.js"></script>
  <script src="js/models/TrilhaEstudo.js"></script>
  <script src="js/models/PlanoEstudo.js"></script>
  <script src="js/services/Notificadores.js"></script>
  <script src="js/services/ServicoAlertaResponsavel.js"></script>
  <script src="js/services/ApiService.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
